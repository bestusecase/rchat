[package]
name = "rchat-mobile"
version = "0.1.3"
edition = "2021"
description = "rchat mobile shell"
publish = false

# Standalone: the engine workspace lives three levels up and must not absorb the
# Tauri shell (different target dirs, different profiles).
[workspace]

[lib]
name = "rchat_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rchatd = { path = "../../../crates/rchatd" }
rchat-core = { path = "../../../crates/rchat-core" }
rchat-ipc = { path = "../../../crates/rchat-ipc" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
jni = "0.21"
anyhow = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug builds ship the whole engine inside the APK; full debug info makes that
# artifact several hundred megabytes without helping on-device work. Line tables
# keep Rust backtraces readable.
[profile.dev]
debug = 1
