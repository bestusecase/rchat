[package]
name = "rchat-desktop"
version = "0.1.2"
edition = "2021"
description = "rchat desktop shell"
publish = false

# Standalone: the engine workspace lives two levels up and must not absorb the
# Tauri shell (different target dirs, different profiles).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
getrandom = "0.2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
