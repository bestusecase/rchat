[workspace]
resolver = "2"
members = [
    "crates/rchat-ipc",
    "crates/rchat-core",
    "crates/rchat-rns",
    "crates/rchatd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
